name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest toolchain we support: catches APIs that need a newer SDK.
          - name: Xcode 16.2
            runner: macos-15
            xcode: '16.2'
          - name: Latest Xcode
            runner: macos-26
            xcode: latest-stable
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Build for Apple silicon and Intel
        run: ./build.sh --universal

      - name: Check the app bundle
        run: |
          codesign --verify --strict build/Cranny.app
          for file in build/Cranny.app/Contents/MacOS/Cranny build/Cranny.app/Contents/Frameworks/MediaHelper.dylib; do
            archs="$(lipo -archs "$file")"
            echo "$file: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Cranny-${{ matrix.runner }}-xcode-${{ matrix.xcode }}
          path: build/Cranny.zip
